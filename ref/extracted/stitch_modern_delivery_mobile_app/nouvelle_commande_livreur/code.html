  </head><body class="bg-background text-on-surface font-body-md"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin-mobile flex items-center justify-between"><span class="font-headline-md text-headline-md text-on-surface">Missions</span><div class="flex items-center gap-sm"><button class="w-11 h-11 flex items-center justify-center"><span class="material-symbols-outlined text-on-surface-variant">notifications</span></button><div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center"><span class="material-symbols-outlined text-on-primary-container text-[18px]">person</span></div></div></div></header><main class="pt-16 min-h-screen bg-surface"><div class="flex flex-col w-full p-margin-mobile">

</div>

</div>
<!-- New Order Card -->
<div class="relative bg-surface-container-lowest rounded-xl shadow-xl overflow-hidden animate-in fade-in zoom-in duration-500">
<!-- Earnings Header -->
<div class="bg-primary-container p-md flex justify-between items-center">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-primary-fixed-variant uppercase tracking-wider">Estimated Earnings</span>
<span class="font-headline-xl text-headline-xl text-on-primary-fixed">€6.50</span>
</div>
<div class="relative w-16 h-16 flex items-center justify-center">
<!-- SVG Countdown Circle -->
<svg class="absolute inset-0 w-full h-full -rotate-90">
<circle class="text-on-primary-container/20" cx="32" cy="32" fill="none" r="28" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-on-primary-container transition-all duration-1000 linear" cx="32" cy="32" fill="none" id="countdown-circle" r="28" stroke="currentColor" stroke-dasharray="175.9" stroke-dashoffset="0" stroke-width="4"></circle>
</svg>
<span class="font-headline-md text-headline-md text-on-primary-container" id="countdown-text">45</span>
</div>
</div>
<!-- Map Snippet -->
<div class="relative h-48 w-full">
<div class="w-full h-full bg-surface-variant" data-location="Plaza del Sol, Madrid to Calle de Velázquez, Madrid" style=""></div>
<div class="absolute bottom-sm left-sm right-sm flex gap-xs">
<div class="bg-surface/90 backdrop-blur-md px-sm py-xs rounded-full shadow-sm flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px] text-primary">navigation</span>
<span class="font-label-sm text-label-sm text-on-surface">Total: 4.2 km</span>
</div>
</div>
</div>
<!-- Order Details -->
<div class="p-md space-y-md">
<!-- Restaurant -->
<div class="flex items-start gap-md">
<div class="w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary text-[28px]">restaurant</span>
</div>
<div class="min-w-0">
<span class="font-label-sm text-label-sm text-on-surface-variant block uppercase">Pick-up</span>
<h3 class="font-headline-md text-headline-md text-on-surface truncate">Burger Master Central</h3>
<p class="font-body-md text-body-md text-on-surface-variant">0.8 km away • Ready in 5 min</p>
</div>
</div>
<!-- Divider with "Flow" line -->
<div class="relative flex justify-center py-xs">
<div class="absolute left-[24px] top-0 bottom-0 w-px bg-dashed bg-outline-variant" style="background-image: linear-gradient(to bottom, transparent 50%, #d4c4ae 50%); background-size: 1px 8px;"></div>
</div>
<!-- Customer -->
<div class="flex items-start gap-md">
<div class="w-12 h-12 rounded-lg bg-secondary-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-secondary-container text-[28px]">home</span>
</div>
<div class="min-w-0">
<span class="font-label-sm text-label-sm text-on-surface-variant block uppercase">Drop-off</span>
<h3 class="font-headline-md text-headline-md text-on-surface truncate">Residential District</h3>
<p class="font-body-md text-body-md text-on-surface-variant">3.4 km from restaurant</p>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="p-md pt-0 flex flex-col gap-sm">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-md text-headline-md shadow-lg active:scale-[0.98] transition-transform flex items-center justify-center gap-sm" id="accept-btn">
        Accept Mission
        <span class="material-symbols-outlined">bolt</span>
</button>
<button class="w-full h-12 bg-transparent text-on-surface-variant font-label-md text-label-md rounded-xl active:bg-surface-container transition-colors">
        Decline
      </button>
</div>
</div>
<!-- Decorative Background Glow -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[150%] h-[50%] bg-primary/5 blur-[120px] rounded-full rotate-12"></div>
</div>
<script>
    (function() {
      let seconds = 45;
      const textElement = document.getElementById('countdown-text');
      const circleElement = document.getElementById('countdown-circle');
      const totalDash = 175.9; // 2 * PI * R (28)

      const timer = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(timer);
          seconds = 0;
        }
        
        textElement.innerText = seconds;
        
        // Update circle stroke-dashoffset
        const progress = seconds / 45;
        circleElement.style.strokeDashoffset = totalDash * (1 - progress);

        if (seconds < 10) {
          textElement.classList.add('text-error');
          circleElement.classList.remove('text-on-primary-container');
          circleElement.classList.add('text-error');
        }
      }, 1000);

      document.getElementById('accept-btn').addEventListener('click', function() {
        this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Connecting...';
        this.classList.add('opacity-80');
        setTimeout(() => {
          // Visual feedback for transition
          this.innerHTML = 'Success!';
          this.classList.replace('bg-primary', 'bg-tertiary');
        }, 800);
      });
    })();
  </script>
