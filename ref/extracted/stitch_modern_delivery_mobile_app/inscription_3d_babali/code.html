<div class="absolute inset-0 w-full h-full" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_24" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_24');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Create a stylized 3D food delivery box or bag
const group = new THREE.Group();

// Box body
const geometry = new THREE.BoxGeometry(2, 2.5, 0.5);
const material = new THREE.MeshPhongMaterial({ 
    color: 0xffc244, // Babali Yellow
    shininess: 100,
    specular: 0x555555
});
const box = new THREE.Mesh(geometry, material);
group.add(box);

// Handle or strap
const strapGeom = new THREE.TorusGeometry(0.8, 0.1, 16, 100, Math.PI);
const strapMat = new THREE.MeshPhongMaterial({ color: 0x8b5e34 }); // Brownish
const strap = new THREE.Mesh(strapGeom, strapMat);
strap.position.y = 1.25;
group.add(strap);

scene.add(group);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xffffff, 1);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Interaction
let mouseX = 0;
let mouseY = 0;
let targetRotationX = 0;
let targetRotationY = 0;

window.addEventListener('mousemove', (event) => {
    mouseX = (event.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
});

function animate() {
    requestAnimationFrame(animate);
    
    // Smooth floating motion
    group.position.y = Math.sin(Date.now() * 0.002) * 0.2;
    
    // React to mouse
    targetRotationY = mouseX * 0.5;
    targetRotationX = mouseY * 0.3;
    
    group.rotation.y += (targetRotationY - group.rotation.y) * 0.05;
    group.rotation.x += (targetRotationX - group.rotation.x) * 0.05;
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();

})();
</script>

<script>
        // Micro-interaction for form labels and focus states
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('shadow-[0_0_15px_-3px_rgba(124,88,0,0.1)]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('shadow-[0_0_15px_-3px_rgba(124,88,0,0.1)]');
            });
        });

        // Simple password visibility toggle
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        toggleBtn?.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            toggleBtn.querySelector('span').innerText = isPass ? 'visibility_off' : 'visibility';
        });
