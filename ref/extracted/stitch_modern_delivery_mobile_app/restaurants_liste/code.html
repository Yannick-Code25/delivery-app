<script>
        // Simple Micro-interactions for chips
        const chips = document.querySelectorAll('button.bg-surface-container-high');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                const isActive = chip.classList.contains('bg-primary-container');
                if (isActive) {
                    chip.classList.remove('bg-primary-container', 'text-on-primary-container');
                    chip.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                } else {
                    chip.classList.add('bg-primary-container', 'text-on-primary-container');
                    chip.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
                }
            });
        });

        // Scroll listener for Top Bar elevation
        const header = document.querySelector('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 20) {
                header.classList.add('shadow-md');
            } else {
                header.classList.remove('shadow-md');
            }
        });
    </script>
