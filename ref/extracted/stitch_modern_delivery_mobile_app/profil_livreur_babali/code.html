<body class="bg-background text-on-background font-body-md min-h-screen pb-32">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim w-full sticky top-0 shadow-sm flex items-center justify-between px-margin-mobile py-sm z-50">

</div>
<button class="bg-surface-container-low text-secondary px-4 py-2 rounded-full font-label-md hover:bg-surface-container-high transition-colors active:scale-95 duration-150">

<main class="px-margin-mobile mt-md">
<!-- Profile Header Section -->
<section class="flex flex-col items-center mb-lg">
<div class="relative group">
<div class="w-28 h-28 rounded-full border-4 border-primary-container p-1 shadow-lg overflow-hidden transition-transform duration-300 group-hover:scale-105">
<img class="w-full h-full object-cover rounded-full" data-alt="A professional and friendly portrait of a delivery driver named Marc Dupont. He is wearing a clean branded polo shirt, smiling warmly at the camera. The background is a slightly blurred urban street in bright daylight, emphasizing a high-energy, premium service atmosphere with natural light and vibrant colors." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBjgerKt4WnQanw2csJPG9qDQxvOzmRSxwFKSuP3-oSLu6diQHFXmcpbY6bbRiST-c1zXma72nEei8kNpY7A74M2uByD7dJrhStWhLFmydpF243O7mYNyTjYCJIMkySnU6tsV7Z0LVzHQbXfVa1R65zmOKOiaqH2mLE9VURv66iU9uxbx_i9u7lh5ByI0sDJhr236HiX2ugdFCR1KCPkYa1LDcDUS8L3D3AYxEKkl3Bein4clzS3CZp7vjRGkN0SZywiWIz_Ep5hTk0"/>
</div>
<div class="absolute bottom-0 right-0 bg-primary-container text-on-primary-container px-2 py-1 rounded-full shadow-md flex items-center gap-1 border-2 border-white">
<span class="material-symbols-outlined text-[16px]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-label-md">4.9</span>
</div>
</div>
<div class="text-center mt-sm">

<span class="bg-primary-container/20 text-primary px-3 py-0.5 rounded-full font-label-sm uppercase tracking-wider">Livreur Gold</span>
</div>
</div>
</section>
<!-- Stats Bento Grid -->
<section class="grid grid-cols-3 gap-base mb-lg">
<div class="bg-surface-container-low p-sm rounded-xl flex flex-col items-center justify-center shadow-sm text-center">

<span class="font-headline-md text-on-background">1,248</span>
</div>
<div class="bg-surface-container-low p-sm rounded-xl flex flex-col items-center justify-center shadow-sm text-center">
<span class="text-secondary font-label-sm mb-1">Note Globale</span>
<span class="font-headline-md text-on-background">4.9/5</span>
</div>
<div class="bg-surface-container-low p-sm rounded-xl flex flex-col items-center justify-center shadow-sm text-center">
<span class="text-secondary font-label-sm mb-1">Ancienneté</span>
<span class="font-headline-md text-on-background">2 ans</span>
</div>
</section>
<!-- Menu List -->

</div>
<span class="material-symbols-outlined text-secondary opacity-50" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Véhicule & Documents -->
<button class="w-full flex items-center justify-between p-md hover:bg-surface-container-low transition-colors active:bg-surface-container-high text-left">

</div>
<span class="material-symbols-outlined text-secondary opacity-50" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Paramètres de disponibilité -->

<span class="material-symbols-outlined" data-icon="schedule">schedule</span>
</div>
<span class="font-label-md text-on-surface">Paramètres de disponibilité</span>
</div>
<span class="material-symbols-outlined text-secondary opacity-50" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Historique des gains -->
<button class="w-full flex items-center justify-between p-md hover:bg-surface-container-low transition-colors active:bg-surface-container-high text-left">
<div class="flex items-center gap-md">
<div class="bg-surface-container-high w-10 h-10 rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
</div>

</div>

</button>

<div class="bg-surface-container-high w-10 h-10 rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="help">help</span>
</div>
<span class="font-label-md text-on-surface">Aide &amp; Support</span>
</div>
<span class="material-symbols-outlined text-secondary opacity-50" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Déconnexion -->
<button class="w-full flex items-center justify-between p-md hover:bg-error-container/20 transition-colors active:bg-error-container/30 text-left group">
<div class="flex items-center gap-md">
<div class="bg-error-container/20 w-10 h-10 rounded-full flex items-center justify-center text-error group-hover:scale-110 transition-transform">

<p class="font-label-sm text-on-primary-container/80 mt-1">Complétez 5 livraisons de plus pour débloquer +10€ aujourd'hui.</p>
</div>
<div class="opacity-20 absolute -right-4 -bottom-4">
<span class="material-symbols-outlined text-[80px]" data-icon="trending_up">trending_up</span>
</div>
</div>

<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface dark:bg-surface-dim shadow-[0_-4px_20px_rgba(0,0,0,0.06)] flex justify-around items-center px-sm py-xs">
<a class="flex flex-col items-center justify-center text-on-secondary-container opacity-70 hover:bg-surface-container-highest transition-all active:scale-90 duration-200 py-2" href="#">
<span class="material-symbols-outlined" data-icon="directions_run">directions_run</span>
<span class="font-label-sm text-label-sm">Missions</span>
</a>
<a class="flex flex-col items-center justify-center text-on-secondary-container opacity-70 hover:bg-surface-container-highest transition-all active:scale-90 duration-200 py-2" href="#">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label-sm text-label-sm">Revenus</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm">Profil</span>
</a>
</nav>
<script>
        // Simple micro-interaction for menu buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                // Potential logic for navigation or state toggle
            });
        });

        // Add a subtle scroll effect to the header
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-md');
            } else {
                header.classList.remove('shadow-md');
            }
        });
    </script>
