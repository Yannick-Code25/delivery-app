<script>
        // Simple Micro-interaction for buttons
        document.querySelectorAll('.bento-card').forEach(button => {
            button.addEventListener('click', () => {
                // Future navigation logic would go here
                console.log('Navigating to: ' + button.innerText.trim());
            });
        });

        // Copy referral code simulation
        const copyBtn = document.querySelector('.group span.material-symbols-outlined');
        if (copyBtn) {
            copyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const code = document.querySelector('code').innerText;
                navigator.clipboard.writeText(code).then(() => {
                    const originalIcon = copyBtn.innerText;
                    copyBtn.innerText = 'check';
                    setTimeout(() => {
                        copyBtn.innerText = originalIcon;
                    }, 2000);
                });
            });
        }
    </script>
