<script>
    // Micro-interaction for the courier marker movement
    const marker = document.getElementById('courier-marker');
    let progress = 0;
    
    function moveCourier() {
        const points = [
            { l: '65%', t: '55%' },
            { l: '55%', t: '50%' },
            { l: '45%', t: '40%' },
            { l: '35%', t: '35%' },
            { l: '28%', t: '28%' }
        ];
        
        let step = 0;
        const interval = setInterval(() => {
            if (step >= points.length) {
                step = 0; // Reset for demo loop
            }
            marker.style.left = points[step].l;
            marker.style.top = points[step].t;
            step++;
        }, 4000);
    }

    moveCourier();

    // Keyframes for the custom shimmer animation
    const style = document.createElement('style');
    style.textContent = `
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    `;
    document.head.appendChild(style);
</script></main></body></html>
