<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Babali - Connexion</title>

                        "surface-tint": "#7c5800",

                        "primary-container": "#ffc244",
                        "surface-container-high": "#e6e8e9",
                        "primary": "#7c5800",
                        "tertiary": "#006b56",
                        "on-background": "#191c1d",
                        "on-secondary-fixed-variant": "#414752",
                        "tertiary-container": "#66e1bf",
                        "on-tertiary-fixed": "#002018",
                        "secondary-fixed": "#dde2f0",
                        "on-error": "#ffffff",
                        "inverse-primary": "#f9bd3f",
                        "primary-fixed": "#ffdea6",
                        "on-primary-fixed": "#271900",
                        "surface-container-low": "#f2f4f5",
                        "on-surface": "#191c1d",

                        "on-tertiary-container": "#00624f",
                        "on-secondary-container": "#5f6570",
                        "on-primary-container": "#715000",
                        "tertiary-fixed": "#7ef8d5",
                        "background": "#f8fafb",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#504534",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#f9bd3f",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2e3132",
                        "on-secondary-fixed": "#161c25",
                        "secondary-fixed-dim": "#c1c7d3",
                        "tertiary-fixed-dim": "#60dbba",
                        "surface-variant": "#e1e3e4",
                        "on-primary-fixed-variant": "#5e4200",

                    "borderRadius": {

                    "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f8fafb;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }
        .login-card {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-bounce:active {
            transform: scale(0.95);
        }
        .input-focus-effect:focus-within {
            box-shadow: 0 0 0 2px #ffc244;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Header Section (Implicit suppression of TopAppBar for Transactional Page) -->
<main class="w-full max-w-md mx-auto space-y-xl animate-fade-in">
<!-- Logo & Branding -->
<div class="flex flex-col items-center text-center space-y-sm">
<div class="w-20 h-20 bg-primary-container rounded-full flex items-center justify-center shadow-lg transform hover:rotate-12 transition-transform duration-300">
<span class="material-symbols-outlined text-on-primary-container text-[40px]" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div class="space-y-xs">
<h1 class="font-headline-xl text-headline-xl text-on-surface">Babali</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                    L'excellence de la livraison, à votre portée.
                </p>
</div>
</div>
<!-- Login Form Card -->
<div class="bg-surface-container-lowest p-lg rounded-[32px] login-card space-y-md border border-outline-variant/30">
<form class="space-y-md" id="loginForm">
<!-- Email Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-2" for="email">Email</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-4 py-3.5 input-focus-effect transition-all">
<span class="material-symbols-outlined text-on-surface-variant/50 mr-3">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-on-surface-variant/40" id="email" placeholder="votre@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Mot de passe</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Oublié ?</a>
</div>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-4 py-3.5 input-focus-effect transition-all">
<span class="material-symbols-outlined text-on-surface-variant/50 mr-3">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md text-on-surface placeholder:text-on-surface-variant/40" id="password" placeholder="••••••••" required="" type="password"/>
<button class="material-symbols-outlined text-on-surface-variant/50 ml-2 hover:text-on-surface" type="button">visibility</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-2 px-2">
<input class="w-4 h-4 text-primary bg-surface-container rounded border-outline-variant focus:ring-primary-container" id="remember" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant" for="remember">Se souvenir de moi</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-xl shadow-md btn-bounce transition-all hover:brightness-105 active:shadow-inner flex items-center justify-center space-x-2" type="submit">
<span>Se connecter</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Social Login Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 font-label-sm text-label-sm text-on-surface-variant/60">Ou continuer avec</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-sm">
<button class="flex items-center justify-center space-x-2 py-3 border border-outline-variant rounded-xl hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface">google</span>
<span class="font-label-md text-label-md">Google</span>
</button>
<button class="flex items-center justify-center space-x-2 py-3 border border-outline-variant rounded-xl hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface">file_download</span>
<span class="font-label-md text-label-md">Apple</span>
</button>
</div>
</div>
<!-- Create Account Link -->
<div class="text-center pt-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                Pas encore de compte ? 
                <a class="text-primary font-bold hover:underline transition-all ml-1" href="#">Créer un compte</a>
</p>
</div>
</main>
<!-- Background Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none opacity-40">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-container/20 rounded-full blur-[80px]"></div>
<div class="absolute top-1/2 -right-48 w-[500px] h-[500px] bg-tertiary-container/10 rounded-full blur-[100px]"></div>
</div>
<!-- Footer Meta -->
<footer class="mt-xl text-center pb-gutter">
<p class="font-label-sm text-label-sm text-on-surface-variant/40">© 2024 Babali Delivery. v2.4.0</p>
</footer>
<script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Interaction Feedback
            btn.innerHTML = `<span class="animate-spin material-symbols-outlined">sync</span><span>Connexion...</span>`;
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.classList.remove('opacity-80');
                // Potential redirect logic here
            }, 1500);
        });

        // Password visibility toggle
        const togglePass = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        togglePass.addEventListener('click', () => {
            const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passInput.setAttribute('type', type);
            togglePass.innerText = type === 'password' ? 'visibility' : 'visibility_off';
        });
    </script>
</body></html>
